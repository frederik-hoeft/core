# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore source/Fho.Core/Fho.Core.slnx
    - name: Build
      run: dotnet build --no-restore source/Fho.Core/Fho.Core.slnx
    - name: Test
      run: dotnet test --no-build --verbosity normal source/Fho.Core/Fho.Core.slnx
